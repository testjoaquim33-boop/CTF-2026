! ============================================================
! B_CE1 - Customer Edge Client B (gauche)
! Rôle : Gateway LAN Client B gauche
! ============================================================

hostname B_CE1

ip cef

! --- Interface LAN (vers PC2) ---
interface FastEthernet0/0
 description LAN Client B - vers PC2
 ip address 192.168.1.1 255.255.255.0
 no shutdown

! --- Interface WAN vers PE1 ---
interface Serial2/1
 description VERS PE1 s2/1 - MPLS VPN
 ip address 10.1.1.5 255.255.255.252
 no shutdown

! --- Routes statiques ---
ip route 192.168.2.0 255.255.255.0 10.1.1.6
ip route 0.0.0.0 0.0.0.0 10.1.1.6

end
