! ============================================================
! P1 - Provider Core 1
! Rôle : Transit MPLS pur (pas de VRF)
! ============================================================

hostname P1

ip cef

! --- Loopback ---
interface Loopback0
 ip address 172.16.1.4 255.255.255.255
 ip ospf 1 area 0

! --- Interfaces Core ---
interface Serial2/1
 description VERS PE1 s2/3
 ip address 80.0.0.14 255.255.255.252
 ip ospf 1 area 0
 mpls ip
 no shutdown

interface Serial2/0
 description VERS P2 s2/0
 ip address 80.0.0.5 255.255.255.252
 ip ospf 1 area 0
 mpls ip
 no shutdown

! --- OSPF Backbone ---
router ospf 1
 router-id 172.16.1.4
 network 172.16.1.4 0.0.0.0 area 0
 network 80.0.0.4 0.0.0.3 area 0
 network 80.0.0.12 0.0.0.3 area 0

! --- MPLS ---
mpls ldp router-id Loopback0 force

end
