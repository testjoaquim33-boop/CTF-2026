! ============================================================
! B_CE2 - Customer Edge Client B (droite)
! Rôle : Gateway LAN Client B droite
! ============================================================

hostname B_CE2

ip cef

! --- Interface LAN (vers PC4) ---
interface FastEthernet0/0
 description LAN Client B - vers PC4
 ip address 192.168.2.1 255.255.255.0
 no shutdown

! --- Interface WAN vers PE2 ---
interface Serial2/1
 description VERS PE2 s2/1 - MPLS VPN
 ip address 10.1.2.5 255.255.255.252
 no shutdown

! --- Routes statiques ---
ip route 192.168.1.0 255.255.255.0 10.1.2.6
ip route 0.0.0.0 0.0.0.0 10.1.2.6

end
