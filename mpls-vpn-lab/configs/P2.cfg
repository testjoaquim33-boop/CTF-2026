! ============================================================
! P2 - Provider Core 2
! Rôle : Transit MPLS pur (pas de VRF)
! ============================================================

hostname P2

ip cef

! --- Loopback ---
interface Loopback0
 ip address 172.16.1.5 255.255.255.255
 ip ospf 1 area 0

! --- Interfaces Core ---
interface Serial2/0
 description VERS P1 s2/0
 ip address 80.0.0.6 255.255.255.252
 ip ospf 1 area 0
 mpls ip
 no shutdown

interface Serial2/3
 description VERS PE2 s2/3
 ip address 80.0.0.17 255.255.255.252
 ip ospf 1 area 0
 mpls ip
 no shutdown

! --- OSPF Backbone ---
router ospf 1
 router-id 172.16.1.5
 network 172.16.1.5 0.0.0.0 area 0
 network 80.0.0.4 0.0.0.3 area 0
 network 80.0.0.16 0.0.0.3 area 0

! --- MPLS ---
mpls ldp router-id Loopback0 force

end
