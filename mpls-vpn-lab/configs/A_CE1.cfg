! ============================================================
! A_CE1 - Customer Edge Client A (gauche)
! Rôle : Gateway primaire LAN Client A gauche (HSRP active)
! ============================================================

hostname A_CE1

ip cef

! --- Interface LAN (vers Switch1 - PC1) ---
interface FastEthernet0/0
 description LAN Client A - vers Switch1
 ip address 192.168.1.2 255.255.255.0
 ! HSRP - Priorité haute = gateway primaire
 standby 1 ip 192.168.1.1
 standby 1 priority 110
 standby 1 preempt
 standby 1 track Serial2/0 20
 no shutdown

! --- Interface WAN vers PE1 ---
interface Serial2/0
 description VERS PE1 s2/0 - MPLS VPN
 ip address 10.1.1.1 255.255.255.252
 no shutdown

! --- Routes statiques ---
! Route vers le réseau distant Client A via PE1
ip route 192.168.2.0 255.255.255.0 10.1.1.2
! Route par défaut optionnelle
ip route 0.0.0.0 0.0.0.0 10.1.1.2

end
