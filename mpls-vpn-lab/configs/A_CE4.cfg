! ============================================================
! A_CE4 - Routeur transit DMVPN
! Rôle : Transit L3 entre RT1, RT2 et PE3 (underlay DMVPN)
! ============================================================

hostname A_CE4

ip cef

! --- Interface vers RT1_BACKUP ---
interface FastEthernet0/0
 description VERS RT1_BACKUP f0/1
 ip address 90.0.0.2 255.255.255.252
 no shutdown

! --- Interface vers RT2_BACKUP ---
interface FastEthernet0/1
 description VERS RT2_BACKUP f0/1
 ip address 90.0.0.5 255.255.255.252
 no shutdown

! --- Interface vers PE3 ---
interface FastEthernet1/0
 description VERS PE3 f0/0
 ip address 90.0.0.9 255.255.255.252
 no shutdown

! Pas de routes statiques nécessaires :
! A_CE4 a les trois subnets 90.0.0.0/30, 90.0.0.4/30, 90.0.0.8/30
! directement connectés, donc il peut router entre eux nativement.

end
