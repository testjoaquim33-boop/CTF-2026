! ============================================================
! RT2_BACKUP - Routeur de bord backup (droite)
! Rôle : Gateway HSRP standby + Spoke DMVPN
! ============================================================

hostname RT2_BACKUP

ip cef

! --- Interface LAN (vers Switch2 - PC3) ---
interface FastEthernet0/0
 description LAN Client A - vers Switch2
 ip address 192.168.2.3 255.255.255.0
 ! HSRP - Priorité basse = gateway backup
 standby 1 ip 192.168.2.1
 standby 1 priority 100
 standby 1 preempt
 no shutdown

! --- Interface WAN vers A_CE4 (underlay DMVPN) ---
interface FastEthernet0/1
 description VERS A_CE4 f0/1 - WAN DMVPN
 ip address 90.0.0.6 255.255.255.252
 no shutdown

! --- DMVPN Tunnel (Spoke) ---
interface Tunnel0
 description DMVPN Spoke vers PE3 Hub - Phase 3
 ip address 10.0.0.3 255.255.255.0
 tunnel source FastEthernet0/1
 tunnel mode gre multipoint
 tunnel key 100
 ip nhrp network-id 1
 ip nhrp nhs 10.0.0.1 nbma 90.0.0.10 multicast
 ip nhrp shortcut
 ip mtu 1400
 ip tcp adjust-mss 1360
 no shutdown

! --- EIGRP sur tunnel DMVPN ---
router eigrp 100
 network 10.0.0.0 0.0.0.255
 network 192.168.2.0 0.0.0.255
 no auto-summary

! --- Route statique underlay ---
! Pour joindre le hub PE3 (90.0.0.10) via A_CE4
ip route 90.0.0.8 255.255.255.252 90.0.0.5

end
