! ============================================================
! PE2 - Provider Edge 2 (droite)
! Rôle : Terminaison MPLS VPN côté Client A/B droite
! ============================================================

hostname PE2

! --- VRF ---
ip vrf CLIENT_A
 rd 65000:1
 route-target export 65000:1
 route-target import 65000:1

ip vrf CLIENT_B
 rd 65000:2
 route-target export 65000:2
 route-target import 65000:2

! --- CEF ---
ip cef

! --- Loopback ---
interface Loopback0
 ip address 172.16.1.2 255.255.255.255
 ip ospf 1 area 0

! --- Interfaces Core (OSPF + MPLS) ---
interface Serial2/2
 description VERS PE3 s2/3
 ip address 80.0.0.10 255.255.255.252
 ip ospf 1 area 0
 mpls ip
 no shutdown

interface Serial2/3
 description VERS P2 s2/3
 ip address 80.0.0.18 255.255.255.252
 ip ospf 1 area 0
 mpls ip
 no shutdown

! --- Interfaces CE (VRF) ---
interface Serial2/0
 description VERS A_CE2 s2/0 - VRF CLIENT_A
 ip vrf forwarding CLIENT_A
 ip address 10.1.2.2 255.255.255.252
 no shutdown

interface Serial2/1
 description VERS B_CE2 s2/1 - VRF CLIENT_B
 ip vrf forwarding CLIENT_B
 ip address 10.1.2.6 255.255.255.252
 no shutdown

! --- OSPF Backbone ---
router ospf 1
 router-id 172.16.1.2
 network 172.16.1.2 0.0.0.0 area 0
 network 80.0.0.8 0.0.0.3 area 0
 network 80.0.0.16 0.0.0.3 area 0

! --- MP-BGP (VPNv4) ---
router bgp 65000
 bgp router-id 172.16.1.2
 no bgp default ipv4-unicast
 neighbor 172.16.1.1 remote-as 65000
 neighbor 172.16.1.1 update-source Loopback0
 !
 address-family vpnv4
  neighbor 172.16.1.1 activate
  neighbor 172.16.1.1 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf CLIENT_A
  redistribute static
 exit-address-family
 !
 address-family ipv4 vrf CLIENT_B
  redistribute static
 exit-address-family

! --- Routes statiques VRF (PE vers CE) ---
ip route vrf CLIENT_A 192.168.2.0 255.255.255.0 10.1.2.1
ip route vrf CLIENT_B 192.168.2.0 255.255.255.0 10.1.2.5

! --- MPLS ---
mpls ldp router-id Loopback0 force

end
