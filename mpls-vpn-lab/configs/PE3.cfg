! ============================================================
! PE3 - Provider Edge 3 (centre, hub DMVPN)
! Rôle : Routeur core MPLS + Hub DMVPN
! ============================================================

hostname PE3

ip cef

! --- Loopback ---
interface Loopback0
 ip address 172.16.1.3 255.255.255.255
 ip ospf 1 area 0

! --- Interfaces Core (OSPF + MPLS) ---
interface Serial2/1
 description VERS PE1 s2/2
 ip address 80.0.0.2 255.255.255.252
 ip ospf 1 area 0
 mpls ip
 no shutdown

interface Serial2/3
 description VERS PE2 s2/2
 ip address 80.0.0.9 255.255.255.252
 ip ospf 1 area 0
 mpls ip
 no shutdown

! --- Interface WAN vers A_CE4 (pour DMVPN underlay) ---
interface FastEthernet0/0
 description VERS A_CE4 f1/0 - Underlay DMVPN
 ip address 90.0.0.10 255.255.255.252
 no shutdown

! --- DMVPN Tunnel (Hub) ---
interface Tunnel0
 description DMVPN Hub - Phase 3
 ip address 10.0.0.1 255.255.255.0
 tunnel source FastEthernet0/0
 tunnel mode gre multipoint
 tunnel key 100
 ip nhrp network-id 1
 ip nhrp map multicast dynamic
 ip nhrp redirect
 ip mtu 1400
 ip tcp adjust-mss 1360
 no ip split-horizon eigrp 100
 no shutdown

! --- OSPF Backbone ---
router ospf 1
 router-id 172.16.1.3
 network 172.16.1.3 0.0.0.0 area 0
 network 80.0.0.0 0.0.0.3 area 0
 network 80.0.0.8 0.0.0.3 area 0

! --- EIGRP sur DMVPN Tunnel ---
router eigrp 100
 network 10.0.0.0 0.0.0.255
 no auto-summary

! --- Routes statiques underlay DMVPN ---
! Pour joindre les spokes via A_CE4
ip route 90.0.0.0 255.255.255.252 90.0.0.9
ip route 90.0.0.4 255.255.255.252 90.0.0.9

! --- MPLS ---
mpls ldp router-id Loopback0 force

end
